<!DOCTYPE html>

<html lang="en">
    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <link href="/static/styles.css" rel="stylesheet">

        <title>StudyLab: {% block title %}{% endblock %}</title>
    </head>
    <body>
        <nav class="bg-dark navbar navbar-expand-md">
            <div class="container-fluid">
                <a class="navbar-brand" href="/"><span class="white">StudyLab</span></a>
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    {% if session["user_id"] %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/my_tasks">My Tasks</a></li>
                            <li class="nav-item"><a class="nav-link" href="/progress">Progress</a></li>
                            <li class="nav-item"><a class="nav-link" href="/change">Change Password</a></li>
                            <li class="nav-item"><a class="nav-link" href="/logout">Log Out</a></li>
                        </ul>
                    {% else %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                            <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                        </ul>
                    {% endif %}
                </div>
            </div>
        </nav>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                    <div id="flash-message" class="alert alert-primary mb-0 text-center" role="alert">
                        {{ messages | join(" ") }}
                    </div>
            {% endif %}
        {% endwith %}
        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>
        <script>
            setTimeout(function() {
                const message = document.getElementById("flash-message");
                if (message) {
                    message.remove();
                }
            }, 3000);
        </script>
    </body>
</html>
